<script type="text/javascript" src="{{ "/js/main.js" | relative_url }}"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- 1. Theme Switcher ---
    var toggleBtn = document.getElementById('theme-toggle');
    var toggleIcon = document.getElementById('theme-toggle-icon');
    var toggleText = document.getElementById('theme-toggle-text');

    function updateThemeIcon() {
      var isDark = document.body.classList.contains('dark-mode');
      if (toggleIcon) {
        toggleIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
      }
      if (toggleText) {
        toggleText.innerText = isDark ? 'Light Mode' : 'Dark Mode';
      }
    }

    updateThemeIcon();

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        var isDark = document.body.classList.toggle('dark-mode');
        document.documentElement.classList.toggle('dark-mode', isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon();
      });
    }

    // --- 2. Live Client-side Post Search ---
    var searchInput = document.getElementById('search-input');
    var postCards = document.querySelectorAll('.post-card');
    var noResults = document.getElementById('no-results');

    if (searchInput && postCards.length > 0) {
      searchInput.addEventListener('input', function(e) {
        var query = e.target.value.toLowerCase().trim();
        var matchCount = 0;

        postCards.forEach(function(card) {
          var title = card.getAttribute('data-title') || '';
          var tags = card.getAttribute('data-tags') || '';
          var categories = card.getAttribute('data-categories') || '';

          if (query === '' || title.includes(query) || tags.includes(query) || categories.includes(query)) {
            card.style.display = 'block';
            matchCount++;
          } else {
            card.style.display = 'none';
          }
        });

        if (noResults) {
          noResults.style.display = (matchCount === 0) ? 'block' : 'none';
        }
      });
    }

    // --- 3. Code Block Header & Copy Button ---
    var codeBlocks = document.querySelectorAll('pre');
    codeBlocks.forEach(function(pre) {
      var parent = pre.parentNode;
      if (parent.classList.contains('highlight')) {
        var wrapper = document.createElement('div');
        wrapper.className = 'highlight-wrapper';

        // Extract language from parent class (e.g. language-kotlin -> kotlin)
        var lang = 'code';
        var codeElem = pre.querySelector('code');
        if (codeElem && codeElem.className) {
          var match = codeElem.className.match(/language-(\w+)/);
          if (match) lang = match[1];
        } else if (parent.className) {
          var matchP = parent.className.match(/language-(\w+)/);
          if (matchP) lang = matchP[1];
        }

        // Code header title bar with left dots/label & right copy button
        var header = document.createElement('div');
        header.className = 'code-header';
        
        var leftGroup = document.createElement('div');
        leftGroup.className = 'code-header-left';
        leftGroup.innerHTML = '<div class="code-dots"><span></span><span></span><span></span></div><span class="code-title">' + lang + '</span>';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = 'Copy';

        copyBtn.addEventListener('click', function() {
          var codeText = codeElem ? codeElem.innerText : pre.innerText;
          navigator.clipboard.writeText(codeText).then(function() {
            copyBtn.innerText = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.innerText = 'Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(function(err) {
            console.error('Failed to copy text: ', err);
          });
        });

        header.appendChild(leftGroup);
        header.appendChild(copyBtn);

        parent.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      }
    });

    // --- 4. Back-To-Top Button ---
    var backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });

      backToTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // --- 5. Share Bar Copy Link Button ---
    var copyShareBtn = document.getElementById('copy-share-link');
    var copyShareIcon = document.getElementById('copy-share-icon');
    var copyShareText = document.getElementById('copy-share-text');

    if (copyShareBtn) {
      copyShareBtn.addEventListener('click', function() {
        var targetUrl = copyShareBtn.getAttribute('data-url') || window.location.href;
        navigator.clipboard.writeText(targetUrl).then(function() {
          if (copyShareIcon) copyShareIcon.className = 'fa fa-check';
          if (copyShareText) copyShareText.innerText = 'Copied!';
          copyShareBtn.classList.add('copied');

          setTimeout(function() {
            if (copyShareIcon) copyShareIcon.className = 'fa fa-link';
            if (copyShareText) copyShareText.innerText = 'Copy Link';
            copyShareBtn.classList.remove('copied');
          }, 2000);
        }).catch(function(err) {
          console.error('Failed to copy share link: ', err);
        });
      });
    }
  });
</script>
