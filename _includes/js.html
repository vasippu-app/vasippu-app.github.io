<script type="text/javascript" src="{{ "/js/main.js" | relative_url }}"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- 1. Segmented Theme Switcher ---
    var toggleBtn = document.getElementById('theme-toggle');

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        var isDark = document.body.classList.toggle('dark-mode');
        document.documentElement.classList.toggle('dark-mode', isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }

    // --- 2. Live Client-side Post Search & Category/Tag Filtering ---
    var searchInput = document.getElementById('search-input');
    var postCards = document.querySelectorAll('.post-card');
    var filterChips = document.querySelectorAll('.filter-chip');
    var noResults = document.getElementById('no-results');
    var currentFilter = 'all';

    function filterPosts() {
      var query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      var matchCount = 0;

      postCards.forEach(function(card) {
        var title = card.getAttribute('data-title') || '';
        var tags = card.getAttribute('data-tags') || '';
        var categories = card.getAttribute('data-categories') || '';
        var filterSlugs = card.getAttribute('data-filter-slugs') || '';

        var matchesQuery = (query === '' || title.includes(query) || tags.includes(query) || categories.includes(query));
        var matchesFilter = (currentFilter === 'all' || filterSlugs.includes(currentFilter));

        if (matchesQuery && matchesFilter) {
          card.style.display = 'block';
          matchCount++;
        } else {
          card.style.display = 'none';
        }
      });

      if (noResults) {
        noResults.style.display = (matchCount === 0) ? 'block' : 'none';
      }
    }

    if (filterChips.length > 0) {
      filterChips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          filterChips.forEach(function(c) { c.classList.remove('active'); });
          chip.classList.add('active');
          currentFilter = chip.getAttribute('data-filter') || 'all';
          filterPosts();
        });
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', filterPosts);
    }

    // Auto-select filter chip from URL params (?filter=... or ?tag=...)
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var filterParam = urlParams.get('filter') || urlParams.get('tag') || urlParams.get('category');
      var hashParam = window.location.hash ? window.location.hash.replace('#', '') : '';
      var targetSlug = filterParam || hashParam;

      if (targetSlug) {
        var matchingChip = document.querySelector('.filter-chip[data-filter="tag-' + targetSlug.toLowerCase() + '"]') ||
                           document.querySelector('.filter-chip[data-filter="cat-' + targetSlug.toLowerCase() + '"]') ||
                           document.querySelector('.filter-chip[data-filter="' + targetSlug.toLowerCase() + '"]');
        if (matchingChip) {
          matchingChip.click();
        }
      }
    })();

    // --- 2b. Interactive Tags Page Filtering ---
    var tagSearchInput = document.getElementById('tag-search-input');
    var tagPills = document.querySelectorAll('#tag-cloud .post-tag');
    var tagGroups = document.querySelectorAll('.tag-group');
    var noTagResults = document.getElementById('no-tag-results');

    if (tagPills.length > 0 && tagGroups.length > 0) {
      var currentSelectedTag = 'all';

      function filterTagsPage() {
        var query = tagSearchInput ? tagSearchInput.value.toLowerCase().trim() : '';
        var visibleGroupCount = 0;

        tagGroups.forEach(function(group) {
          var groupSlug = group.id.toLowerCase();
          var groupName = group.getAttribute('data-tag-name') || '';
          var items = group.querySelectorAll('.tag-item');
          var groupMatchesTag = (currentSelectedTag === 'all' || groupSlug === currentSelectedTag);

          var visibleItemCount = 0;
          items.forEach(function(item) {
            var title = item.getAttribute('data-title') || '';
            var matchesQuery = (query === '' || title.includes(query) || groupName.includes(query));

            if (matchesQuery && groupMatchesTag) {
              item.style.display = 'flex';
              visibleItemCount++;
            } else {
              item.style.display = 'none';
            }
          });

          if (visibleItemCount > 0 && groupMatchesTag) {
            group.style.display = 'block';
            visibleGroupCount++;
          } else {
            group.style.display = 'none';
          }
        });

        if (noTagResults) {
          noTagResults.style.display = (visibleGroupCount === 0) ? 'block' : 'none';
        }
      }

      tagPills.forEach(function(pill) {
        pill.addEventListener('click', function() {
          tagPills.forEach(function(p) { p.classList.remove('active'); });
          pill.classList.add('active');
          currentSelectedTag = pill.getAttribute('data-tag-target') || 'all';

          filterTagsPage();

          if (currentSelectedTag !== 'all') {
            var targetGroup = document.getElementById(currentSelectedTag);
            if (targetGroup) {
              targetGroup.scrollIntoView({ behavior: 'smooth' });
            }
            history.pushState(null, null, '#' + currentSelectedTag);
          } else {
            history.pushState(null, null, window.location.pathname);
          }
        });
      });

      if (tagSearchInput) {
        tagSearchInput.addEventListener('input', filterTagsPage);
      }

      // Check URL hash on page load (e.g. /tags/#jekyll)
      var hash = window.location.hash ? window.location.hash.replace('#', '').toLowerCase() : '';
      if (hash) {
        var targetPill = document.querySelector('#tag-cloud .post-tag[data-tag-target="' + hash + '"]');
        if (targetPill) {
          targetPill.click();
        }
      }
    }

    // --- 3. Code Block Header & Copy Button ---
    var codeBlocks = document.querySelectorAll('pre');
    codeBlocks.forEach(function(pre) {
      var parent = pre.parentNode;
      if (parent.classList.contains('highlight')) {
        var wrapper = document.createElement('div');
        wrapper.className = 'highlight-wrapper';

        // Extract language from parent class (e.g. language-kotlin -> kotlin)
        var lang = 'code';
        var codeElem = pre.querySelector('code');
        if (codeElem && codeElem.className) {
          var match = codeElem.className.match(/language-(\w+)/);
          if (match) lang = match[1];
        } else if (parent.className) {
          var matchP = parent.className.match(/language-(\w+)/);
          if (matchP) lang = matchP[1];
        }

        // Code header title bar with left dots/label & right copy button
        var header = document.createElement('div');
        header.className = 'code-header';
        
        var leftGroup = document.createElement('div');
        leftGroup.className = 'code-header-left';
        leftGroup.innerHTML = '<div class="code-dots"><span></span><span></span><span></span></div><span class="code-title">' + lang + '</span>';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = 'Copy';

        copyBtn.addEventListener('click', function() {
          var codeText = codeElem ? codeElem.innerText : pre.innerText;
          navigator.clipboard.writeText(codeText).then(function() {
            copyBtn.innerText = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.innerText = 'Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(function(err) {
            console.error('Failed to copy text: ', err);
          });
        });

        header.appendChild(leftGroup);
        header.appendChild(copyBtn);

        parent.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      }
    });

    // --- 4. Back-To-Top Button ---
    var backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });

      backToTopBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // --- 5. Share Bar Copy Link Button ---
    var copyShareBtn = document.getElementById('copy-share-link');
    var copyShareIcon = document.getElementById('copy-share-icon');
    var copyShareText = document.getElementById('copy-share-text');

    if (copyShareBtn) {
      copyShareBtn.addEventListener('click', function() {
        var targetUrl = copyShareBtn.getAttribute('data-url') || window.location.href;
        navigator.clipboard.writeText(targetUrl).then(function() {
          if (copyShareIcon) copyShareIcon.className = 'fa fa-check';
          if (copyShareText) copyShareText.innerText = 'Copied!';
          copyShareBtn.classList.add('copied');

          setTimeout(function() {
            if (copyShareIcon) copyShareIcon.className = 'fa fa-link';
            if (copyShareText) copyShareText.innerText = 'Copy Link';
            copyShareBtn.classList.remove('copied');
          }, 2000);
        }).catch(function(err) {
          console.error('Failed to copy share link: ', err);
        });
      });
    }

    // --- 6. Reading Progress Bar ---
    var progressBar = document.getElementById('reading-progress-bar');
    var postArticle = document.querySelector('.post-content') || document.getElementById('post');

    if (progressBar && postArticle) {
      function updateReadingProgress() {
        var articleTop = postArticle.offsetTop;
        var articleHeight = postArticle.offsetHeight;
        var windowHeight = window.innerHeight;
        var scrollTop = window.scrollY;

        var scrollableDistance = articleHeight - windowHeight;
        if (scrollableDistance <= 0) {
          progressBar.style.width = '100%';
          return;
        }

        var currentProgress = (scrollTop - articleTop) / scrollableDistance;
        var progressPercent = Math.min(Math.max(currentProgress * 100, 0), 100);
        progressBar.style.width = progressPercent + '%';
      }

      window.addEventListener('scroll', updateReadingProgress);
      updateReadingProgress();
    }
  });
</script>
