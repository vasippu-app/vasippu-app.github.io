{% if page.author %} {% assign author = site.data.authors[page.author] %}{% else %}{% assign author = site.owner %} {% endif %}

<div class="cover-card table-cell table-middle">
  {% if author.avatar %}
  <a href="{{ "/" | relative_url }}" class="avatar-container">
    <img src="{{ "/img/" | append: author.avatar | relative_url }}" alt="{{ author.name }}" class="avatar">
  </a>
  {% endif %}
  <a href="{{ "/" | relative_url }}" class="author_name">{{ author.name }}</a>
  <span class="author_job">{{ author.job }}</span>
  <span class="author_bio mbm">{{ author.bio }}</span>
  <nav class="nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="{{ "/" | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}><i class="fa fa-home"></i> Home</a>
      </li>
      <li class="nav-item">
        <a href="{{ "/archive/" | relative_url }}" {% if page.url contains '/archive' %}class="active"{% endif %}><i class="fa fa-archive"></i> Archive</a>
      </li>
      <li class="nav-item">
        <a href="{{ "/tags/" | relative_url }}" {% if page.url contains '/tags' %}class="active"{% endif %}><i class="fa fa-tags"></i> Tags</a>
      </li>
    </ul>
  </nav>
  {% include social-links.html %}
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle theme">
    <i class="fa fa-moon-o" id="theme-toggle-icon"></i>
    <span id="theme-toggle-text">Dark Mode</span>
  </button>
</div>
